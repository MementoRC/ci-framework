---
# ============================================================================
# REUSABLE CI PIPELINE - Quality, Testing & Security
# ============================================================================
# Centralized quality pipeline for all repos. Update once here, every consumer
# gets the improvement automatically.
#
# USAGE (recommended — remote call):
#    ```yaml
#    permissions: read-all          # Scorecard-safe top-level
#
#    jobs:
#      ci:
#        permissions:               # Elevated grants scoped to this job
#          contents: read
#          actions: read
#          id-token: write          # OpenSSF Scorecard
#          # security-events: write — NOT NEEDED when CI_BOT_TOKEN is
#          # provided (see secrets below).  Omit for clean Scorecard
#          # Token-Permissions score.
#        uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@<sha>  # <version>
#        with:
#          pixi-environment: 'ci'
#          python-versions: '["3.10", "3.11", "3.12"]'
#          enable-postgres: true    # optional: adds PostgreSQL service container
#        secrets: inherit
#    ```
#
# For release/publishing, add reusable-release.yml as a separate job:
#    ```yaml
#      release:
#        needs: ci
#        uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-release.yml@main
#        permissions:
#          id-token: write
#          contents: write
#        secrets: inherit
#    ```
#
# See standalone-ci.yml for a simplified local-only template.
# See reusable-release.yml for PyPI publishing (requires caller permissions).
# ============================================================================
name: Reusable CI Pipeline

on:
  workflow_call:
    inputs:
      pixi-environment:
        description: "The PIXI environment to use (default, quality, dev, ci)"
        required: false
        type: string
        default: 'ci'
      pixi-version:
        description: >-
          Pixi CLI version passed to prefix-dev/setup-pixi. Note this is the
          pixi BINARY version, not the setup-pixi action tag. It must be new
          enough to read the consumer's pixi.lock schema: pixi >= v0.68.0 is
          required for lock schema v7. Override this when your lockfile is
          regenerated by a newer pixi than the framework default (issue #250).
        required: false
        type: string
        default: 'v0.74.0'
      python-versions:
        description: "JSON array of Python versions for the test matrix"
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'
      python-version-env-pattern:
        description: >-
          Naming pattern for per-Python-version pixi environments, used to make
          the python-versions matrix test the interpreter each leg claims.
          Supports two placeholders: {version} (e.g. 3.11) and {nodot} (e.g.
          311). When the resolved environment exists in the consumer's pixi
          manifest it is used for that matrix leg; otherwise the job falls back
          to `pixi-environment` and reports that the leg is not testing its
          declared version (issue #251).
        required: false
        type: string
        default: 'py{nodot}'
      strict-python-matrix:
        description: >-
          Fail a matrix leg when the interpreter pixi actually resolved does not
          match that leg's python-version. Default false, which reports the
          mismatch as a warning instead, so adopting this framework version does
          not turn existing pipelines red. Set true once per-version pixi
          environments are declared (issue #251).
        required: false
        type: boolean
        default: false
      os-matrix:
        description: "JSON array of OS for the test matrix"
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
      enable-performance:
        description: >-
          Enable performance benchmarks and regression analysis
        required: false
        type: boolean
        default: true
      allowed-licenses:
        description: >-
          Comma-separated list of allowed licenses for dependency review
        required: false
        type: string
        default: 'MIT, Apache-2.0, BSD-3-Clause'
      package-path:
        description: >-
          Relative path to the package directory within the monorepo
        required: false
        type: string
        default: '.'
      editable-install:
        description: >-
          Install package in editable mode before testing (pixi-only)
        required: false
        type: boolean
        default: true
      enable-hygiene-check:
        description: >-
          Enable repository hygiene checks for dev artifacts
        required: false
        type: boolean
        default: true
      # --- Security inputs ---
      fail-on-cve:
        description: "Fail on known dependency CVEs"
        required: false
        type: boolean
        default: true
      fail-on-sast:
        description: "Fail on SAST findings"
        required: false
        type: boolean
        default: false
      fail-on-secrets:
        description: "Fail on detected secrets"
        required: false
        type: boolean
        default: true
      scorecard:
        description: "Run OpenSSF Scorecard"
        required: false
        type: boolean
        default: true
      codeql:
        description: "Run CodeQL SAST in this workflow. Default false: CodeQL is owned by reusable-security.yml so the two workflows don't upload the same codeql-<lang> category and produce a neutral CodeQL check (issue #215). Enable only when consuming reusable-ci.yml WITHOUT reusable-security.yml."
        required: false
        type: boolean
        default: false
      codeql-languages:
        description: >-
          Comma-separated CodeQL language allowlist (e.g. "python" or
          "python,javascript-typescript"). When set, this overrides the
          filesystem autodetection for the CodeQL matrix ONLY, so a
          Python/Cython repo whose only C/C++ is generated or a committed
          test fixture isn't forced into a spurious c-cpp analysis whose
          autobuild fails (issue #227). Valid values: python, c-cpp,
          javascript-typescript. Empty (default) = autodetect from sources.
        required: false
        type: string
        default: ''
      # --- Quality inputs ---
      fail-on-lint:
        description: "Fail on lint violations"
        required: false
        type: boolean
        default: true
      fail-on-format:
        description: "Fail on format violations"
        required: false
        type: boolean
        default: true
      fail-on-typecheck:
        description: "Fail on type checking errors"
        required: false
        type: boolean
        default: false
      python-version:
        description: "Python version for quality tools (non-pixi jobs)"
        required: false
        type: string
        default: '3.12'
      # --- Service container inputs ---
      enable-postgres:
        description: >-
          Provision a PostgreSQL 16 service container and set POSTGRES_DSN
          for integration tests. Only applies to ubuntu runners.
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: "Token for uploading coverage reports to Codecov"
        required: false
      GH_PAT:
        description: >-
          Personal Access Token for actions requiring it (like PR comments)
        required: false
      SOURCERY_TOKEN:
        description: "Token for Sourcery AI code reviewer"
        required: false
      CI_BOT_TOKEN:
        description: >-
          PAT with security_events scope for SARIF uploads (CodeQL,
          Semgrep, Scorecard).  When provided, callers do NOT need
          security-events: write on GITHUB_TOKEN, keeping Scorecard
          Token-Permissions clean.  Falls back to github.token.
        required: false

# NOTE: No top-level permissions block. For workflow_call, the CALLER
# controls the GITHUB_TOKEN permissions. A top-level block here would
# cap all per-job permissions, breaking id-token grants needed by
# Scorecard jobs.
#
# Callers should grant at the job level (not top-level, to satisfy Scorecard):
#   contents: read, actions: read, id-token: write
#
# SARIF uploads (CodeQL, Semgrep, Scorecard) use CI_BOT_TOKEN when
# available, falling back to github.token.  This avoids needing
# security-events: write on GITHUB_TOKEN.  All upload steps use
# continue-on-error as a safety net.

jobs:
  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.changes.outputs.src }}
      docs: ${{ steps.changes.outputs.docs }}
      tests: ${{ steps.changes.outputs.tests }}
      ci: ${{ steps.changes.outputs.ci }}
      performance: ${{ steps.changes.outputs.performance }}
      security: ${{ steps.changes.outputs.security }}
      python: ${{ steps.detect.outputs.python }}
      rust: ${{ steps.detect.outputs.rust }}
      c_cpp: ${{ steps.detect.outputs.c_cpp }}
      cython: ${{ steps.detect.outputs.cython }}
      js_ts: ${{ steps.detect.outputs.js_ts }}
      codeql_matrix: ${{ steps.codeql-matrix.outputs.matrix }}
      has_codeql: ${{ steps.codeql-matrix.outputs.has_codeql }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - '${{ inputs.package-path }}/src/**'
              - '${{ inputs.package-path }}/framework/**'
              - '${{ inputs.package-path }}/pyproject.toml'
              - '${{ inputs.package-path }}/pixi.lock'
              - '!${{ inputs.package-path }}/framework/tests/**'
            docs:
              - '${{ inputs.package-path }}/docs/**'
              - '${{ inputs.package-path }}/*.md'
            tests:
              - '${{ inputs.package-path }}/tests/**'
              - '${{ inputs.package-path }}/framework/tests/**'
            ci:
              - '.github/workflows/**'
            performance:
              - '${{ inputs.package-path }}/tests/performance/**'
              - '${{ inputs.package-path }}/framework/tests/performance/**'
            security:
              - '.github/workflows/security.yml'
              - '${{ inputs.package-path }}/pyproject.toml'
              - '${{ inputs.package-path }}/pixi.toml'
              - '${{ inputs.package-path }}/pixi.lock'
              - '${{ inputs.package-path }}/requirements*.txt'
      - id: detect
        run: |
          # Python: pyproject.toml or setup.py
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          # Rust: Cargo.toml
          if [ -f Cargo.toml ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          # C/C++: CMakeLists.txt or source files
          if [ -f CMakeLists.txt ] || \
             find . \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) \
               -not -path "./.pixi/*" -not -path "./.git/*" -print -quit | grep -q .; then
            echo "c_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "c_cpp=false" >> "$GITHUB_OUTPUT"
          fi

          # Cython: .pyx or .pxd files
          if find . \( -name "*.pyx" -o -name "*.pxd" \) \
               -not -path "./.pixi/*" -not -path "./.git/*" -print -quit | grep -q .; then
            echo "cython=true" >> "$GITHUB_OUTPUT"
          else
            echo "cython=false" >> "$GITHUB_OUTPUT"
          fi

          # JavaScript/TypeScript: package.json
          if [ -f package.json ]; then
            echo "js_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "js_ts=false" >> "$GITHUB_OUTPUT"
          fi

      # Shared composite action (referenced by pinned remote ref because a
      # ./-relative local action would resolve against the CALLER's checkout
      # in a reusable workflow, not this repo — issue #227). Pinned to a
      # release tag rather than @main to avoid version drift for consumers
      # pinned to an older workflow tag (issue #230); release-please keeps
      # this ref in lockstep via the x-release-please-version marker.
      - id: codeql-matrix
        uses: Claire-s-Monster/ci-framework/.github/actions/setup-codeql-matrix@v2.9.9  # x-release-please-version
        with:
          codeql-languages: ${{ inputs.codeql-languages }}
          python: ${{ steps.detect.outputs.python }}
          c_cpp: ${{ steps.detect.outputs.c_cpp }}
          js_ts: ${{ steps.detect.outputs.js_ts }}

  hygiene:
    name: "🧹 Repository Hygiene"
    runs-on: ubuntu-latest
    if: inputs.enable-hygiene-check
    steps:
      - uses: actions/checkout@v7
      - name: "Check for pixi project"
        working-directory: ${{ inputs.package-path }}
        run: |
          if [ ! -f pixi.toml ] && [ ! -f pixi.lock ] && ! grep -q '\[tool\.pixi' pyproject.toml 2>/dev/null; then
            echo "::error::No pixi.toml or pixi.lock found, and no [tool.pixi] section in pyproject.toml. ci-framework requires pixi-based projects."
            exit 1
          fi
          echo "✅ Pixi project detected"
      - name: "Check for tracked dev artifacts"
        working-directory: ${{ inputs.package-path }}
        run: |
          ERRORS=0
          # Check for __pycache__ directories
          if git ls-files --error-unmatch '*/__pycache__/*' 2>/dev/null; then
            echo "::error::__pycache__ directories are tracked in git"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for .pyc files
          if git ls-files --error-unmatch '*.pyc' 2>/dev/null; then
            echo "::error::.pyc files are tracked in git"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for .pytest_cache
          if git ls-files --error-unmatch '.pytest_cache/*' 2>/dev/null; then
            echo "::error::.pytest_cache is tracked in git"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for .mypy_cache
          if git ls-files --error-unmatch '.mypy_cache/*' 2>/dev/null; then
            echo "::error::.mypy_cache is tracked in git"
            ERRORS=$((ERRORS + 1))
          fi
          # Check for .gitignore
          if [ ! -f .gitignore ]; then
            echo "::error::.gitignore file is missing"
            ERRORS=$((ERRORS + 1))
          fi
          # Warnings (non-fatal)
          if git ls-files --error-unmatch '*.env' 2>/dev/null; then
            echo "::warning::.env files are tracked in git"
          fi
          if git ls-files --error-unmatch '.DS_Store' 'Thumbs.db' 2>/dev/null; then
            echo "::warning::OS-specific files are tracked in git"
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "::error::Found $ERRORS hygiene issues"
            exit 1
          fi
          echo "✅ Repository hygiene checks passed"

  # ============================================================================
  # Quality Jobs
  # ============================================================================

  python-quality:
    name: "🐍 Python Quality (Pixi)"
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Install Dependencies"
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_ENV: ${{ inputs.pixi-environment }}
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! pixi install -e "$PIXI_ENV" 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Run Linters and Formatters"
        id: quality
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_ENV: ${{ inputs.pixi-environment }}
        run: pixi run -e "$PIXI_ENV" quality
        continue-on-error: true
      - name: Fail on quality issues
        if: inputs.fail-on-lint && steps.quality.outcome == 'failure'
        run: exit 1

  rust-lint:
    name: "🦀 Rust Lint (Clippy)"
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Clippy
        id: clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
      - name: Fail on lint
        if: inputs.fail-on-lint && steps.clippy.outcome == 'failure'
        run: exit 1

  rust-format:
    name: "🦀 Rust Format"
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: rustfmt check
        id: format
        run: cargo fmt --check
        continue-on-error: true
      - name: Fail on format
        if: inputs.fail-on-format && steps.format.outcome == 'failure'
        run: exit 1

  c-cpp-lint:
    name: "⚙️ C/C++ Lint"
    needs: detect-changes
    if: needs.detect-changes.outputs.c_cpp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          style: file
          tidy-checks: ''
          version: 17
          files-changed-only: true
          thread-comments: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cpp-linter.sarif
          category: cpp-linter
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true
      - name: Fail on lint
        if: inputs.fail-on-lint && steps.linter.outputs.checks-failed > 0
        run: exit 1

  cython-lint:
    name: "🔧 Cython Lint"
    needs: detect-changes
    if: needs.detect-changes.outputs.cython == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install cython-lint
        run: pip install cython-lint
      - name: Run cython-lint
        id: lint
        run: |
          find . \( -name "*.pyx" -o -name "*.pxd" \) \
            -not -path "./.pixi/*" -not -path "./.git/*" \
            -exec cython-lint {} +
        continue-on-error: true
      - name: Fail on lint
        if: inputs.fail-on-lint && steps.lint.outcome == 'failure'
        run: exit 1

  js-lint:
    name: "📦 JS/TS Lint (ESLint)"
    needs: detect-changes
    if: needs.detect-changes.outputs.js_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install and lint
        id: lint
        run: |
          if compgen -G ".eslintrc*" >/dev/null || compgen -G "eslint.config.*" >/dev/null || \
             jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm ci
            npm run lint
          else
            echo "No ESLint config found, skipping"
          fi
        continue-on-error: true
      - name: Fail on lint
        if: inputs.fail-on-lint && steps.lint.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # Security Jobs
  # ============================================================================

  python-dep-audit:
    name: "🐍 Python Dependency Audit (Pixi)"
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Install Dependencies"
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_ENV: ${{ inputs.pixi-environment }}
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! pixi install -e "$PIXI_ENV" 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Run dependency audit"
        id: audit
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_ENV: ${{ inputs.pixi-environment }}
        run: |
          # Use the project's safety-check pixi task if available
          if pixi task list -e "$PIXI_ENV" 2>/dev/null | grep -q safety-check; then
            echo "Running project safety-check task..."
            pixi run -e "$PIXI_ENV" safety-check
          else
            echo "::notice::No safety-check pixi task found — skipping dependency audit"
            echo "Add a safety-check task to your pixi environment to enable auditing"
          fi
        continue-on-error: true
      - name: Fail on CVEs
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  rust-dep-audit:
    name: "🦀 Rust Dependency Audit"
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-audit
        id: audit
        uses: actions-rust-lang/audit@v1
        continue-on-error: true
      - name: Fail on advisories
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  rust-deny:
    name: "🦀 Rust License & Advisory Policy"
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  js-dep-audit:
    name: "📦 JS/TS Dependency Audit"
    needs: detect-changes
    if: needs.detect-changes.outputs.js_ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm audit
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Fail on high/critical
        if: inputs.fail-on-cve && steps.audit.outcome == 'failure'
        run: exit 1

  sast-semgrep:
    name: "🔬 Semgrep SAST"
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        id: semgrep
        run: semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: p/python p/security-audit
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true
      - name: Fail on SAST findings
        if: inputs.fail-on-sast && steps.semgrep.outcome == 'failure'
        run: exit 1

  sast-codeql:
    name: "🔬 CodeQL Analysis"
    needs: detect-changes
    # Gated off by default to avoid colliding with reusable-security.yml on the
    # codeql-<lang> SARIF category (issue #215). Opt in via the `codeql` input
    # when using this workflow standalone (no reusable-security.yml).
    if: inputs.codeql && needs.detect-changes.outputs.has_codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-changes.outputs.codeql_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # c-cpp uses build-mode: none so a repo with no C/C++ build system
          # (Cython-generated sources or a committed test fixture) isn't
          # hard-failed by autobuild, which would cascade into a required CI
          # failure (issue #227). Other languages keep the default build mode.
          build-mode: ${{ matrix.language == 'c-cpp' && 'none' || '' }}
      - if: matrix.language != 'c-cpp'
        uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results
          category: codeql-${{ matrix.language }}
      - name: Upload CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-results/${{ matrix.language }}.sarif
          category: codeql-${{ matrix.language }}
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true

  secret-scan:
    name: "🔑 Secret Scanning"
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        id: trufflehog
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          extra_args: --only-verified
        continue-on-error: true
      - name: Fail on verified secrets
        if: inputs.fail-on-secrets && steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::Verified secrets detected in repository"
          exit 1

  scorecard:
    name: "📊 OpenSSF Scorecard"
    if: inputs.scorecard
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
          token: ${{ secrets.CI_BOT_TOKEN || github.token }}
        continue-on-error: true

  # ============================================================================
  # Test & Build Jobs
  # ============================================================================

  test:
    name: "🧪 Test Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.src == 'true' ||
      needs.detect-changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
        python-version: ${{ fromJson(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@v7
      # actions/setup-python removed here: `pixi run` uses the environment's
      # own interpreter, so the runner-installed one was never used (#251).
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Resolve pixi environment for this matrix leg"
        working-directory: ${{ inputs.package-path }}
        env:
          PY_VERSION: ${{ matrix.python-version }}
          ENV_PATTERN: ${{ inputs.python-version-env-pattern }}
          DEFAULT_ENV: ${{ inputs.pixi-environment }}
        run: |
          NODOT="${PY_VERSION//./}"
          CANDIDATE="${ENV_PATTERN//\{version\}/$PY_VERSION}"
          CANDIDATE="${CANDIDATE//\{nodot\}/$NODOT}"
          RESOLVED="$DEFAULT_ENV"
          # `pixi info` is tolerated failing here: a lockfile the pinned CLI
          # cannot read is diagnosed by the install step's guard (issue #250),
          # which gives a far better message than anything this step could.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::notice::jq unavailable; cannot probe for pixi environment '$CANDIDATE', using '$DEFAULT_ENV'"
          elif pixi info --json 2>/dev/null | jq -e --arg e "$CANDIDATE" \
                 '.environments_info[]? | select(.name == $e)' >/dev/null 2>&1; then
            RESOLVED="$CANDIDATE"
            echo "Using per-version pixi environment '$CANDIDATE' for Python $PY_VERSION"
          else
            echo "No pixi environment named '$CANDIDATE'; falling back to '$DEFAULT_ENV'"
          fi
          echo "RESOLVED_PIXI_ENV=$RESOLVED" >> "$GITHUB_ENV"
          echo "MATRIX_PY_VERSION=$PY_VERSION" >> "$GITHUB_ENV"
      - name: "Install Dependencies"
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! pixi install -e "$RESOLVED_PIXI_ENV" 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Editable Install (pixi-only)"
        if: inputs.editable-install
        working-directory: ${{ inputs.package-path }}
        run: |
          if [ ! -f pixi.toml ] && [ ! -f pixi.lock ] && ! grep -q '\[tool\.pixi' pyproject.toml 2>/dev/null; then
            echo "::error::No pixi.toml or pixi.lock found, and no [tool.pixi] section in pyproject.toml. ci-framework requires pixi-based projects."
            exit 1
          fi
          pixi run -e "$RESOLVED_PIXI_ENV" pip install -e . --no-deps
      - name: "Verify interpreter matches this matrix leg"
        working-directory: ${{ inputs.package-path }}
        env:
          STRICT: ${{ inputs.strict-python-matrix }}
        run: |
          ACTUAL="$(pixi run -e "$RESOLVED_PIXI_ENV" python -c \
            'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' \
            2>/dev/null | tr -d '[:space:]')"
          if [ -z "$ACTUAL" ]; then
            echo "::warning title=Python matrix unverified::Could not determine the interpreter for pixi environment '$RESOLVED_PIXI_ENV'; this leg's Python version is unverified."
            exit 0
          fi
          if [ "$ACTUAL" = "$MATRIX_PY_VERSION" ]; then
            echo "Verified: pixi environment '$RESOLVED_PIXI_ENV' runs Python $ACTUAL"
            exit 0
          fi
          MSG="this job is named for Python $MATRIX_PY_VERSION but pixi environment '$RESOLVED_PIXI_ENV' runs Python $ACTUAL, so this leg does not test its declared version. Declare a per-version pixi environment (default naming: py${MATRIX_PY_VERSION//./}) to make the matrix real. See https://github.com/Claire-s-Monster/ci-framework/issues/251"
          {
            echo "- Python $MATRIX_PY_VERSION leg actually ran Python $ACTUAL (env '$RESOLVED_PIXI_ENV')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STRICT" = "true" ]; then
            echo "::error title=Python matrix mismatch::$MSG"
            exit 1
          fi
          echo "::warning title=Python matrix mismatch::$MSG"
      - name: "Run Test Suite"
        working-directory: ${{ inputs.package-path }}
        env:
          PYTHONNOUSERSITE: "1"  # ignore runner ~/.local so it cannot shadow pixi-pinned deps (issue #235)
        run: |
          pixi run -e "$RESOLVED_PIXI_ENV" test

  test-postgres:
    name: "🐘 Test+PG Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      inputs.enable-postgres &&
      (needs.detect-changes.outputs.src == 'true' ||
