---
name: CI Framework CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]
  schedule:
    - cron: '0 0 * * *'  # Nightly build
  workflow_dispatch:

permissions: read-all

jobs:
  lint-and-format:
    name: "🧹 Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Pixi"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.74.0
          manifest-path: pyproject.toml
          cache: false
      - name: "Install Quality Dependencies"
        run: |
          pixi install --locked -e quality || exit 1
          pixi install --locked -e dev || exit 1
      - name: "Run Full Lint Check"
        run: |
          echo "Running comprehensive lint checks..."
          pixi run -e quality lint-full
      - name: "Run Action Lint"
        run: |
          # Lint ALL workflows (no hand-maintained file list): a prior
          # hardcoded subset silently drifted out of sync with the
          # workflows directory, letting real findings go unnoticed.
          pixi run -e dev actionlint
      - name: "Run Composite Action Shellcheck"
        run: |
          # actionlint has no composite-action support and yaml-lint is scoped
          # to .github/workflows/, so the bash embedded in every action.yml is
          # checked by nothing else (#261). Discovery walks the action trees
          # rather than reading a file list, so a new action is covered the
          # moment it is added.
          pixi run action-shellcheck
      - name: "Run YAML Lint"
        run: |
          # yamllint over the workflow tree and both action trees. The task
          # existed and was documented but no job invoked it, so it could not
          # fail (#274). No --strict: .yamllint.yml keeps line-length and
          # truthy at warning level deliberately, so error-level findings
          # (trailing-spaces, missing EOF newline) are what gate this step.
          pixi run yaml-lint
      - name: "Run Custom Workflow Lint"
        run: |
          # Lint ALL workflows (no hand-maintained file list): the prior
          # six-file list covered 6 of the 18 workflows and silently omitted
          # branch-policy.yml, the exact file #255 found a script injection in
          # (#279). Discovery walks .github/workflows/, so a new workflow is
          # covered the moment it is added.
          pixi run workflow-lint
      - name: "Run Format Check"
        run: |
          echo "Running format check..."
          pixi run -e quality format-check
      - name: "Run Type Check"
        run: |
          # No `|| echo`: the swallow made this step always succeed, so a mypy
          # error could not fail CI while `pixi run quality` — which hard-
          # depends on typecheck — failed locally (#278). If type checking is
          # ever meant to be advisory, use an explicit `continue-on-error: true`
          # here rather than an exit-code swallow, which is invisible in the
          # job summary.
          echo "Running type check..."
          pixi run -e quality typecheck

  pre-commit-hooks:
    name: "🪝 Pre-commit Hooks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Pixi"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.74.0
          manifest-path: pyproject.toml
          cache: false
      - name: "Install Quality-Extended Dependencies"
        run: |
          pixi install --locked -e quality-extended || exit 1
      - name: "Run Pre-commit Hooks"
        run: |
          # Blocking gate (#277): the hooks in .pre-commit-config.yaml
          # existed but nothing in CI ran them, so a contributor who never
          # installed the local git hook (`pixi run install-pre-commit`)
          # could merge code the hooks would have rejected. Invokes the
          # pixi task (which itself delegates to the quality-extended env),
          # not a bare `pre-commit`, so this resolves the same way it does
          # for a developer running it locally.
          pixi run -e quality-extended pre-commit

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # CodeQL SARIF upload
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Pixi"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.74.0
          manifest-path: pyproject.toml
          cache: false
      - name: "Install Security Dependencies"
        run: |
          pixi install --locked -e quality-extended || exit 1
          ls -la .pixi
      - name: "Run pip-audit (dependency vulnerabilities)"
        run: |
          pixi run -e quality-extended safety-check
        continue-on-error: true
      - name: "Run Bandit (static analysis)"
        run: |
          pixi run -e quality-extended security-scan
        continue-on-error: true
      - name: "Install Dev Dependencies for detect-secrets"
        run: |
          pixi install --locked -e dev || exit 1
      - name: "Run detect-secrets"
        run: |
          pixi run -e dev detect-secrets
        continue-on-error: true
      - name: "Initialize CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: "Perform CodeQL Analysis"
        uses: github/codeql-action/analyze@v4

  unit-tests:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Pixi"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.74.0
          manifest-path: pyproject.toml
          cache: false
      - name: "Install CI Dependencies"
        run: |
          pixi install --locked -e ci || exit 1
          ls -la .pixi
      - name: "Debug CI environment"
        run: |
          pixi info || echo "Pixi info failed"
          pixi run -e ci which pytest || echo "Pytest not found in CI environment"
      - name: "Run Unit Tests with Coverage"
        run: |
          pixi run -e ci pytest framework/tests/ --cov=framework --cov-report=xml || \
          pixi run -e quality pytest framework/tests/ -v

  workflow-validation:
    name: "🔗 Workflow Validation Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Pixi"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.74.0
          manifest-path: pyproject.toml
          cache: false
      - name: "Install CI Dependencies"
        run: |
          pixi install --locked -e ci || exit 1
      - name: "Run Workflow Structural Tests"
        run: |
          pixi run -e ci pytest framework/tests/workflows/test_reusable_workflow_lint.py -v --no-cov

  code-policy:
    name: "📐 Code Policy Check"
    uses: ./.github/workflows/reusable-code-policy.yml
    with:
      check-mode: 'all'
      max-file-lines: 500
      fail-on-violation: false

  summary:
    name: "✅ CI Summary"
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        pre-commit-hooks,
        security-scan,
        unit-tests,
        workflow-validation,
        code-policy,
      ]
    if: always()
    steps:
      - name: "Generate Run Summary"
        run: |
          {
            echo "## CI Framework CI Summary"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Lint & Format | ${{ needs.lint-and-format.result }} |"
            echo "| Pre-commit Hooks | ${{ needs.pre-commit-hooks.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Unit Tests | ${{ needs.unit-tests.result }} |"
            echo "| Workflow Validation | ${{ needs.workflow-validation.result }} |"
            echo "| Code Policy | ${{ needs.code-policy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=false
          for result in \
            "${{ needs.lint-and-format.result }}" \
            "${{ needs.pre-commit-hooks.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.workflow-validation.result }}" \
            "${{ needs.code-policy.result }}"; do
            if [[ "$result" == "failure" ]]; then
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "**Overall: Some checks failed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "**Overall: All checks passed.**" >> "$GITHUB_STEP_SUMMARY"
          fi
