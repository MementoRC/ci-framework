  performance:
    name: "📊 Performance Analysis"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >-
      inputs.enable-performance &&
      needs.detect-changes.outputs.performance == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Install Performance Environment"
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! pixi install -e dev 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Run Benchmarks"
        working-directory: ${{ inputs.package-path }}
        run: |
          pixi run -e dev pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            || echo "No benchmark tests found or benchmarks failed"
      - name: "Upload Benchmark Results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: '${{ inputs.package-path }}/benchmark-results.json'
          if-no-files-found: ignore

  build:
    name: "📦 Build Package"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: "Setup PIXI Environment"
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ inputs.pixi-version }}
          cache: false
      - name: "Install Dependencies"
        working-directory: ${{ inputs.package-path }}
        env:
          PIXI_VER: ${{ inputs.pixi-version }}
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/pixi-install.log"
          if ! pixi install -e quality-ci 2>&1 | tee "$LOG"; then
            if grep -qi 'lock file version' "$LOG"; then
              LOCK_V="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' pixi.lock 2>/dev/null | head -n1)"
              echo "::error title=pixi lock schema unsupported::pixi.lock uses lock-file schema v${LOCK_V:-unknown}, which the pinned pixi CLI ($PIXI_VER) cannot read. Raise this workflow's 'pixi-version' input to a pixi release that supports schema v${LOCK_V:-?} (schema v7 requires pixi >= v0.68.0), or regenerate pixi.lock with pixi $PIXI_VER. See https://github.com/Claire-s-Monster/ci-framework/issues/250"
            fi
            exit 1
          fi
      - name: "Build sdist and wheel"
        working-directory: ${{ inputs.package-path }}
        run: |
          pixi run -e quality-ci build
      - uses: actions/upload-artifact@v7
        with:
          name: 'dist'
          path: '${{ inputs.package-path }}/dist/'

  self-heal:
    name: "🩹 Self-Healing (Manual Trigger)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: "Run Self-Healing"
        run: |
          echo "Self-healing placeholder — customize via workflow_dispatch inputs."

  summary:
    name: "✅ CI Summary"
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - hygiene
      - python-quality
      - rust-lint
      - rust-format
      - c-cpp-lint
      - cython-lint
      - js-lint
      - python-dep-audit
      - rust-dep-audit
      - rust-deny
      - js-dep-audit
      - sast-semgrep
      - sast-codeql
      - secret-scan
      - scorecard
      - test
      - test-postgres
      - performance
      - build
      - self-heal
    if: always()
    steps:
      - name: "Generate Run Summary"
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          PYTHON_QUALITY_RESULT: ${{ needs.python-quality.result }}
          RUST_LINT_RESULT: ${{ needs.rust-lint.result }}
          RUST_FORMAT_RESULT: ${{ needs.rust-format.result }}
          CPP_LINT_RESULT: ${{ needs.c-cpp-lint.result }}
          CYTHON_LINT_RESULT: ${{ needs.cython-lint.result }}
          JS_LINT_RESULT: ${{ needs.js-lint.result }}
          PYTHON_DEP_AUDIT_RESULT: ${{ needs.python-dep-audit.result }}
          RUST_DEP_AUDIT_RESULT: ${{ needs.rust-dep-audit.result }}
          RUST_DENY_RESULT: ${{ needs.rust-deny.result }}
          JS_DEP_AUDIT_RESULT: ${{ needs.js-dep-audit.result }}
          SAST_SEMGREP_RESULT: ${{ needs.sast-semgrep.result }}
          SAST_CODEQL_RESULT: ${{ needs.sast-codeql.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          SCORECARD_RESULT: ${{ needs.scorecard.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SELF_HEAL_RESULT: ${{ needs.self-heal.result }}
        run: |
          {
            echo "## CI Pipeline Summary"
            echo ""
            echo "### Quality"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Hygiene | $HYGIENE_RESULT |"
            echo "| Python Quality | $PYTHON_QUALITY_RESULT |"
            echo "| Rust Lint | $RUST_LINT_RESULT |"
            echo "| Rust Format | $RUST_FORMAT_RESULT |"
            echo "| C/C++ Lint | $CPP_LINT_RESULT |"
            echo "| Cython Lint | $CYTHON_LINT_RESULT |"
            echo "| JS/TS Lint | $JS_LINT_RESULT |"
            echo ""
            echo "### Security"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Python Dep Audit | $PYTHON_DEP_AUDIT_RESULT |"
            echo "| Rust Dep Audit | $RUST_DEP_AUDIT_RESULT |"
            echo "| Rust Deny | $RUST_DENY_RESULT |"
            echo "| JS/TS Dep Audit | $JS_DEP_AUDIT_RESULT |"
            echo "| Semgrep SAST | $SAST_SEMGREP_RESULT |"
            echo "| CodeQL | $SAST_CODEQL_RESULT |"
            echo "| Secret Scan | $SECRET_SCAN_RESULT |"
            echo "| OpenSSF Scorecard | $SCORECARD_RESULT |"
            echo ""
            echo "### Tests & Build"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Test | $TEST_RESULT |"
            echo "| Test+PG | $TEST_POSTGRES_RESULT |"
            echo "| Performance | $PERFORMANCE_RESULT |"
            echo "| Build | $BUILD_RESULT |"
            echo "| Self-Heal | $SELF_HEAL_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Determine overall status (skipped jobs are OK; warn-only jobs excluded)
          FAILED=false
          for result in \
            "$HYGIENE_RESULT" \
            "$PYTHON_QUALITY_RESULT" \
            "$RUST_LINT_RESULT" \
            "$RUST_FORMAT_RESULT" \
            "$CPP_LINT_RESULT" \
            "$CYTHON_LINT_RESULT" \
            "$JS_LINT_RESULT" \
            "$PYTHON_DEP_AUDIT_RESULT" \
            "$RUST_DEP_AUDIT_RESULT" \
            "$RUST_DENY_RESULT" \
            "$JS_DEP_AUDIT_RESULT" \
            "$SECRET_SCAN_RESULT" \
            "$TEST_RESULT" \
            "$TEST_POSTGRES_RESULT" \
            "$BUILD_RESULT"; do
            if [[ "$result" == "failure" ]]; then
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "**Overall: Some checks failed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "**Overall: All checks passed.**" >> "$GITHUB_STEP_SUMMARY"
          fi
