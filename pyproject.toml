[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-framework-tools"
version = "2.9.9"
description = "Internal tools and scripts for the CI Framework."
# 3.11 is the floor because `tomllib` is stdlib only from 3.11, and this repo
# imports it bare — including in composite actions that run on the consumer's
# runner. See #281.
requires-python = ">=3.11"
authors = [
    { name = "MementoRC", email = "your-email@example.com" }
]
dependencies = [
]

[project.optional-dependencies]

[tool.pixi.project]
name = "ci-framework-tools"
version = "2.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]  # Local development on linux, CI matrix handles cross-platform testing

# Core dependencies for the default environment
[tool.pixi.dependencies]
python = "3.12.*"
pytest = "*"
psutil = "*"
pandas = "*"
pyyaml = "*"
requests = "*"
hypothesis = "*"
pytest-workflow = ">=2.1.0,<3"
pytest-cov = ">=6.2.1,<7"
pytest-mock = ">=3.14.1,<4"
responses = ">=0.25.7,<0.26"
tomli-w = "*"  # TOML writing for migration tools
radon = ">=6.0.1,<7"
vulture = ">=2.7.0"

# ===== TIERED QUALITY FEATURES =====
# TIER 1: Essential Quality Gates (ZERO-TOLERANCE)
[tool.pixi.feature.quality.dependencies]
# Core Testing Framework
pytest = ">=8.0.0"
pytest-cov = ">=4.0.0"
pytest-timeout = ">=2.1.0"
pytest-asyncio = ">=0.21.0"
pytest-xdist = ">=3.3.0"

# Type Checking
mypy = ">=1.0.0"

# Core Linting & Formatting (ruff already in base dependencies)
ruff = "*"

# TIER 2: Extended Quality & Security
[tool.pixi.feature.quality-extended.dependencies]
# Security Scanning
bandit = ">=1.7.0"
pip-audit = ">=2.6.0"
pyyaml = "*"  # Required for framework/security/cli.py SBOM generation

# Code Quality Analysis
radon = ">=6.0.0"
vulture = ">=2.7.0"

# Git Hooks
pre-commit = ">=3.0.0"

# TIER 3: CI/CD & Build
[tool.pixi.feature.quality-ci.dependencies]
# CI Reporting
pytest-json-report = ">=1.5.0"
pytest-html = ">=4.0.0"

# Build Tools
python-build = ">=0.10.0"

# Coverage Tools
coverage = ">=7.0.0"

# TIER 4: Development & Specialized Tools
[tool.pixi.feature.dev-specialized.dependencies]
# Legacy development tools
black = "*"
yamllint = "*"
actionlint = "*"
# shellcheck: required for parity with GitHub-hosted runners, which ship shellcheck
# and thereby cause actionlint to auto-enable its shellcheck integration.
shellcheck = "*"
bc-detect-secrets = "*"
twine = "*"
cyclonedx-bom = "*"
filelock = "*"

# Performance & Analysis
memory_profiler = "*"
pytest-benchmark = "*"

[tool.pixi.environments]
# Basic runtime environment
default = {solve-group = "default"}

# Quality gate environments (tiered approach)
quality = {features = ["quality"], solve-group = "default"}
quality-extended = {features = ["quality", "quality-extended"], solve-group = "default"}
quality-full = {features = ["quality", "quality-extended", "quality-ci"], solve-group = "default"}

# Development environment (full quality + specialized tools)
dev = {features = ["quality", "quality-extended", "quality-ci", "dev-specialized"], solve-group = "default"}

# CI environment (quality + CI reporting)
ci = {features = ["quality", "quality-ci"], solve-group = "default"}

# Ensure proper environment isolation
[tool.pixi.activation]
env = { PYTHONNOUSERSITE = "1" }

[tool.pixi.tasks]
# ===== TIER 1: CORE DEVELOPMENT TASKS (ESSENTIAL) =====
# Installation & Setup
install-editable = "echo 'Editable install not needed - PIXI environment handles all dependencies'"
dev = "echo 'Development environment ready'"

# Testing (ZERO-TOLERANCE QUALITY GATES)
test = "pixi run -e quality test-impl"
test-impl = "pytest framework/tests/ -v"
test-cov = "pixi run -e quality test-cov-impl"
test-cov-impl = "pytest framework/tests/ --cov=framework --cov-report=term-missing --cov-report=xml"
test-unit = "pytest framework/tests/unit/ -v"
test-integration = "pytest framework/tests/integration/ -v"
test-property = "pytest framework/tests/property/ -v"
test-security = "pytest framework/tests/security/ -v"
test-reporting = "pytest framework/tests/reporting/ -v"
test-performance = "pytest framework/tests/performance/ -v"
test-maintenance = "pytest framework/tests/maintenance/ -v"

# Quality Gates (CRITICAL - MUST PASS)
lint = "pixi run -e quality lint-impl"
lint-impl = "ruff check framework/ --select=F,E9"
lint-full = "pixi run -e quality lint-full-impl"
lint-full-impl = "ruff check framework/"
lint-fix = "pixi run -e quality lint-fix-impl"
lint-fix-impl = "ruff check --fix framework/"
format = "pixi run -e quality format-impl"
format-impl = "ruff format framework/"
format-check = "pixi run -e quality format-check-impl"
format-check-impl = "ruff format --check framework/"
typecheck = "pixi run -e quality typecheck-impl"
typecheck-impl = "mypy framework/"

# Combined Quality Check - 🚨 MANDATORY BEFORE COMMIT
# Depends on `lint-full`, not `lint`: CI runs the full configured ruff ruleset
# (ci.yml -> `pixi run -e quality lint-full`), so a gate built on `lint`
# (`--select=F,E9`) is strictly weaker than CI and lets UP/I/B/SIM/RUF
# violations through to cost a full push cycle (#271). `lint` stays defined as
# the fast inner-loop check; it is just no longer the mandatory gate.
quality = { depends-on = ["test", "lint-full", "format-check", "typecheck"] }   # NEVER commit without this passing

# Emergency Quality Fix - USE FOR "Found X errors" CI FAILURES
emergency-fix = "pixi run lint-fix && pixi run format && pixi run test"

# ===== TIER 2: SECURITY & COMPLIANCE TASKS =====
# Security Scanning
security-scan = "pixi run -e quality-extended security-scan-impl"
security-scan-impl = "bandit -r framework/ --severity-level high -x framework/tests/"
safety-check = "pixi run -e quality-extended safety-check-impl"
safety-check-impl = "pip-audit --verbose"
# radon and vulture are base [tool.pixi.dependencies] (lines 41-42), so they
# are available in every environment including `default` — unlike the tasks
# above, these two deliberately stay bare. There is no env-mismatch bug to
# fix here (#268); do not add -impl delegation as unneeded churn.
complexity-check = "radon cc framework/ --min B"
dead-code-check = "vulture framework/ --min-confidence 80"

# Static Analysis Suite
static-analysis = { depends-on = ["security-scan", "safety-check", "complexity-check", "dead-code-check"] }

# Comprehensive Check
check-all = { depends-on = ["quality", "static-analysis"] }

# ===== TIER 3: CI/CD & DEPLOYMENT TASKS =====
# CI-specific variants
ci-test = { cmd = "pytest framework/tests/ --cov=framework --cov-report=xml", env = { ENVIRONMENT = "ci" } }
ci-lint = "pixi run -e quality ci-lint-impl"
ci-lint-impl = "ruff check framework/ --output-format=github"
ci-format-check = "pixi run -e quality format-check-impl"

# Build & Deploy
build = "pixi run -e dev build-impl"
build-impl = "python -m build"
clean = "rm -rf __pycache__ .pytest_cache .coverage htmlcov .ruff_cache dist build"

# Pre-commit Integration - PREVENT CI FAILURES
pre-commit = "pixi run -e quality-extended pre-commit-impl"
pre-commit-impl = "pre-commit run --all-files"
install-pre-commit = "pixi run -e quality-extended install-pre-commit-impl"   # 🚨 ESSENTIAL: Run once per developer
install-pre-commit-impl = "pre-commit install --install-hooks"

# ===== LEGACY/SPECIALIZED TASKS =====
# Keep existing specialized tasks for backward compatibility
# Scope covers the workflow tree and both action trees: composite actions
# are shipped product surface (#261) and were previously linted by nothing.
# Runs WITHOUT --strict deliberately: .yamllint.yml sets line-length and
# truthy to level: warning on purpose, because ::error:: annotation messages
# must stay on one physical line. --strict would promote those accepted
# warnings to blocking failures - the error-level findings (trailing-spaces,
# new-line-at-end-of-file) are what gate the job. Scope is guarded by
# framework/tests/workflows/test_yaml_lint_scope.py so it cannot silently
# narrow again (#255 lesson).
yaml-lint = "pixi run -e dev yaml-lint-impl"
yaml-lint-impl = "yamllint .github/workflows/ .github/actions/ actions/"

# Shellcheck the bash embedded in composite action `runs.steps[].run` bodies.
# actionlint has no composite-action support, so this is the only thing that
# checks them (#261).
action-shellcheck = "pixi run -e dev action-shellcheck-impl"
action-shellcheck-impl = "python -m framework.action_shellcheck"
action-lint = "pixi run -e dev action-lint-impl"
action-lint-impl = "actionlint"

# Custom workflow linter for the anti-patterns actionlint cannot see
# (double ${{ }} wrapping in job-level if:, undeclared workflow_call
# inputs, unguarded dependency-review-action, inconsistent pixi pins).
# Discovery walks .github/workflows/ rather than reading a file list: the
# prior hand-maintained six-file list in ci.yml covered 6 of 18 workflows
# and omitted branch-policy.yml, the exact file #255 found a script
# injection in (#279). Runs in `dev` because ci.yml's lint job already
# installs that env. Scope is guarded by
# framework/tests/workflows/test_workflow_lint_scope.py so it cannot
# silently narrow again.
workflow-lint = "pixi run -e dev workflow-lint-impl"
workflow-lint-impl = "python -m framework.workflow_lint"
security-audit = "pixi run -e quality-extended security-audit-impl"
security-audit-impl = "pip-audit --verbose"
bandit-scan = "pixi run -e quality-extended bandit-scan-impl"
bandit-scan-impl = "bandit -r framework/ -x framework/tests/ -s B101"
detect-secrets = "pixi run -e dev detect-secrets-impl"
detect-secrets-impl = "detect-secrets scan --exclude-files '__pycache__' --exclude-files '*.pyc' --exclude-files '*.egg-info' --exclude-files '.git' --exclude-files 'pixi.lock'"
unit-test = "pytest framework/tests/"

# Performance & Benchmarking
# pytest-benchmark is dev-only. Unlike the exit-127 breakage fixed above, a
# bare invocation here still resolves `pytest` itself (a base dependency) and
# fails differently: a pytest usage error on the unrecognized
# `--benchmark-only` flag, not "command not found" — a failure mode a
# 127-only check would miss (#268).
benchmark = "pixi run -e dev benchmark-impl"
benchmark-impl = "pytest framework/tests/benchmarks/ --benchmark-only --benchmark-sort=mean"
benchmark-save = "pixi run -e dev benchmark-save-impl"
benchmark-save-impl = "pytest framework/tests/benchmarks/ --benchmark-only --benchmark-save=baseline"
benchmark-compare = "pixi run -e dev benchmark-compare-impl"
benchmark-compare-impl = "pytest framework/tests/benchmarks/ --benchmark-only --benchmark-compare"

# Coverage Analysis
test-coverage = "pixi run -e quality test-coverage-impl"
test-coverage-impl = "pytest framework/tests/ --cov=framework --cov-branch --cov-report=html --cov-report=xml --cov-report=json --cov-report=term-missing"
test-coverage-json = "pixi run -e quality test-coverage-json-impl"
test-coverage-json-impl = "pytest framework/tests/ --cov=framework --cov-branch --cov-report=json --json-report --json-report-file=pytest-report.json"

# Framework-specific tasks
sbom-generate = "pixi run -e dev sbom-generate-impl"
sbom-generate-impl = "cyclonedx-py -o ci-framework-sbom.json"

[tool.ruff]
# Must track `[project] requires-python` (#284). At py310, ruff classified
# `tomllib` as third-party and would never propose a 3.11+ idiom.
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "UP007",  # Use X | Y for type annotations (requires Python 3.10+)
]

[tool.ruff.lint.per-file-ignores]
"framework/tests/**/*" = ["F401", "F811", "F403"]

[tool.mypy]
# Must track `[project] requires-python` (#284). At 3.10, typeshed marks
# `tomllib` as unavailable, so mypy was reasoning about a tree whose
# central assumption (#281) is false under the version it was handed.
python_version = "3.11"
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["framework/tests"]
# The project is intentionally never pip-installed (see `install-editable`),
# and pytest puts the test file's directory on sys.path rather than the repo
# root - so `import framework` fails from a test even though
# `python -m framework.x` works. Put the root on the path explicitly.
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, <30s timeout)",
    "integration: Integration tests (medium, <120s timeout)",
    "property: Property-based tests",
    "security: Security tests",
    "reporting: Reporting tests",
    "performance: Performance tests",
    "maintenance: Maintenance tests",
    "e2e: End-to-end tests (slow, <300s timeout)",
    "slow: Slow tests (extended timeout)",
    "benchmark: Performance benchmark tests (no timeout)",
    "asyncio: Async tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["framework"]
branch = true
parallel = false
omit = [
    "framework/tests/*",
    "framework/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
precision = 2
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"
title = "CI Framework Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.paths]
source = [
    "framework",
    "*/framework"
]

# Bandit security scanning configuration
[tool.bandit]
exclude_dirs = ["framework/tests"]
skips = ["B101"]  # Allow assert statements in test files
targets = ["framework"]

# Security decisions for CI framework:
# B404: subprocess import - Required for CI functionality, used securely with validation
# B603: subprocess call - Used with shell=False and comprehensive input validation
